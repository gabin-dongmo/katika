services:
  db:
    build:   
      context: ./docker/db
    platform: linux/amd64    
    environment:
      POSTGRES_DB: katika
      POSTGRES_USER: katika
      POSTGRES_PASSWORD: katika
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config_french_unaccent.sql:/docker-entrypoint-initdb.d/01-french_unaccent.sql:ro
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U katika -d katika"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DJANGO_DB_NAME: katika
      DJANGO_DB_USER: katika
      DJANGO_DB_PASSWORD: katika
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_AUTO_POPULATE: "1"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:   
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  postgres_data: